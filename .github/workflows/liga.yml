name: Liga memebots
on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # boton para lanzarlo a mano
permissions:
  contents: write
concurrency:
  group: memebots
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bots.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - run: |
          git config user.name "memebots"
          git config user.email "memebots@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "tick $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
