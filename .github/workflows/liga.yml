name: Liga 100 bots
on:
  schedule:
    - cron: "30 22 * * *"   # cada dia, tras el cierre de Wall Street
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: liga
  cancel-in-progress: false
jobs:
  sesion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python league.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - run: |
          git config user.name "liga-bots"
          git config user.email "liga-bots@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "sesion $(date -u +%F)"
          git pull --rebase
          git push
