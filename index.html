<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liga Memebots · Trading floor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1319; --panel:#161b24; --line:#262e3b; --ink:#e9ecf2; --mute:#8a93a6;
  --floor:#d9ddd0; --floor2:#c9cebf; --lime:#c6f432; --red:#ff4d5e; --amber:#f5b642;
  --display:"Chakra Petch", "Arial Narrow", sans-serif;
  --body:"Inter Tight", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;line-height:1.05}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:.04em}
.kpi{display:flex;flex-direction:column}
.kpi span{font-size:12px;color:var(--mute)}
.kpi b{font-family:var(--display);font-size:20px;font-weight:700}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute);white-space:nowrap}
.pill.live{border-color:var(--lime);color:var(--lime)}
.pos{color:var(--lime)} .neg{color:var(--red)}
.grid{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 70px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2,.tabs button{font-family:var(--display);font-weight:500;font-size:14px}
aside h2{margin:0;padding:14px 18px 8px;color:var(--mute)}
.feed{overflow:auto;padding:0 18px 18px;flex:1;max-height:calc(100vh - 120px)}
.msg{padding:9px 0;border-bottom:1px solid var(--line)}
.msg .who{font-weight:600;font-size:13px}
.msg .when{color:var(--mute);font-size:12px;margin-left:6px}
.msg p{margin:2px 0 0;font-size:14px}
main{display:flex;flex-direction:column;min-width:0}
.floorwrap{position:relative;padding:8px 12px 0}
#floor{width:100%;height:auto;display:block;max-height:64vh}
.tabs{display:flex;gap:4px;padding:0 20px;border-top:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;color:var(--mute);padding:12px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--lime)}
.tabs button:focus-visible,.desk:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pane{padding:12px 20px 28px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.dead td{color:var(--mute)}
.detail{position:absolute;right:16px;top:12px;width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none}
.detail.open{display:block}
.detail h3{font-family:var(--display);margin:0 0 2px;font-size:18px}
.detail .close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer}
.detail{max-height:calc(100% - 24px);overflow:auto}
.detail h4{font-family:var(--display);font-weight:500;font-size:13px;color:var(--mute);margin:12px 0 4px}
.detail ul{list-style:none;padding:0;margin:0;font-size:13px}
.detail li{padding:6px 0;border-bottom:1px solid var(--line)}
.detail li b{font-weight:600}
.rules{margin:0;padding-left:18px;font-size:13px}
.rules li{border:0;padding:2px 0}
.hint{color:var(--mute);font-size:13px;margin:0 20px 8px}
.empty{padding:40px 20px;color:var(--mute);max-width:60ch}
.desk{cursor:pointer}
@keyframes blink{50%{opacity:.35}}
.hot{animation:blink 1.2s ease-in-out 6}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}
@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  aside{order:3;border-right:0;border-top:1px solid var(--line)}
  .feed{max-height:none}
  .floorwrap{overflow-x:auto;padding:4px 0 0}
  #floor{min-width:660px;max-height:none}
  .top{gap:10px 18px;padding:12px 14px}
  .kpi b{font-size:17px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Liga Memebots<small>Trading floor</small></div>
  <div class="kpi"><span>Patrimonio</span><b id="k-total">—</b></div>
  <div class="kpi"><span>Resultado</span><b id="k-res">—</b></div>
  <div class="kpi"><span>Ronda</span><b id="k-ronda">—</b></div>
  <span class="pill live">Precios reales · dinero virtual</span>
  <span class="pill" id="k-upd">Cargando…</span>
</header>

<div class="grid">
  <aside>
    <h2>Charla del floor</h2>
    <div class="feed" id="feed"></div>
  </aside>
  <main>
    <div class="floorwrap">
      <svg id="floor" viewBox="70 8 760 445" role="img" aria-label="Planta del trading floor con los bots en sus mesas"></svg>
      <div class="detail" id="detail" role="dialog" aria-live="polite"></div>
    </div>
    <p class="hint">Toca una mesa para ver las reglas del bot y el motivo de cada operación.</p>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="ranking">Ranking</button>
      <button role="tab" aria-selected="false" data-tab="ops">Operaciones</button>
      <button role="tab" aria-selected="false" data-tab="mercado">Mercado</button>
      <button role="tab" aria-selected="false" data-tab="rondas">Rondas</button>
    </nav>
    <section class="pane" id="pane"></section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const HOUR = 3600, DAY = 86400;
let S = null, CFG = null, tab = "ranking";

const eur = v => v.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const pct = v => (v>=0?"+":"") + (v*100).toLocaleString("es-ES",{maximumFractionDigits:1}) + " %";
const cls = v => v>=0 ? "pos" : "neg";
const dt = ts => new Date(ts*1000).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const sym = t => (CFG && CFG.tokens[t]) || t;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function price(t){ const h=S.history[t]; return h&&h.length ? h[h.length-1][1] : null }
function value(b){ let v=b.cash; for(const [t,q] of Object.entries(b.pos)) v+=q*(price(t)??b.entry[t]??0); return v }
function ret(b){ return value(b)/CFG.capital_inicial_eur-1 }
function holding(b){ return Object.keys(b.pos)[0] }
function change(t,h){
  const hist=S.history[t]; if(!hist||!hist.length) return null;
  const target=S.ultima-h*HOUR; let old=null;
  for(const [ts,p] of hist){ if(ts<=target+600) old=p; else break }
  return old? price(t)/old-1 : null;
}

async function load(){
  try{
    const [s,c] = await Promise.all([
      fetch("state.json?t="+Date.now()).then(r=>{if(!r.ok) throw 0; return r.json()}),
      fetch("config.json?t="+Date.now()).then(r=>r.json())
    ]);
    S=s; CFG=c; render();
  }catch(e){
    $("#pane").innerHTML = '<p class="empty">Todavía no hay datos. La liga crea <code>state.json</code> en su primera ejecución: ve a la pestaña Actions de tu repositorio, abre "Liga memebots" y pulsa Run workflow. Esta página se actualiza sola cada 5 minutos.</p>';
    $("#k-upd").textContent = "Sin datos";
  }
}

function render(){
  const bots=[...S.bots].sort((a,b)=>(a.vivo===b.vivo? ret(b)-ret(a) : a.vivo?-1:1));
  const total=bots.reduce((s,b)=>s+value(b),0), inv=bots.length*CFG.capital_inicial_eur;
  $("#k-total").textContent=eur(total);
  const r=$("#k-res"); r.textContent=(total-inv>=0?"+":"")+eur(total-inv); r.className=cls(total-inv);
  const fin=S.ronda_inicio+CFG.dias_por_ronda*DAY, left=Math.max(0,(fin-S.ultima)/DAY);
  $("#k-ronda").textContent=`${S.ronda} · quedan ${left.toLocaleString("es-ES",{maximumFractionDigits:1})} d`;
  $("#k-upd").textContent="Actualizado "+dt(S.ultima);
  drawFloor(bots); drawFeed(bots); drawPane(bots);
}

/* ---------- planta isométrica ---------- */
const TW=120, TH=60, OX=450, OY=70;
const iso=(x,y,z=0)=>[OX+(x-y)*TW/2, OY+(x+y)*TH/2 - z];
function poly(pts,fill,stroke){ const p=document.createElementNS(NS,"polygon"); p.setAttribute("points",pts.map(q=>q.join(",")).join(" ")); p.setAttribute("fill",fill); if(stroke){p.setAttribute("stroke",stroke);p.setAttribute("stroke-width","1")} return p }
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent&&parent.appendChild(e); return e }
function box(g,x,y,w,d,h,top,left,right){
  const a=iso(x,y,h),b=iso(x+w,y,h),c=iso(x+w,y+d,h),dd=iso(x,y+d,h);
  const b0=iso(x+w,y,0),c0=iso(x+w,y+d,0),d0=iso(x,y+d,0);
  g.appendChild(poly([dd,c,c0,d0],left)); g.appendChild(poly([c,b,b0,c0],right)); g.appendChild(poly([a,b,c,dd],top));
}
const SPOTS=[[0.6,0.5],[3.9,0.4],[2.2,2.0],[0.4,3.4],[3.8,3.0]];

function drawFloor(bots){
  const svg=$("#floor"); svg.innerHTML="";
  const g=el("g",{},svg);
  for(let x=0;x<6;x++) for(let y=0;y<6;y++)
    g.appendChild(poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)], (x+y)%2?"var(--floor)":"var(--floor2)","#b7bcad"));
  // zona cementerio
  const graveyard=[iso(4.6,4.6),iso(6,4.6),iso(6,6),iso(4.6,6)];
  g.appendChild(poly(graveyard,"#3a2328","#ff4d5e55"));
  const gl=iso(5.3,5.3); el("text",{x:gl[0],y:gl[1]+4,"text-anchor":"middle","font-family":"Chakra Petch, Arial Narrow, sans-serif","font-size":"13",fill:"#ff8b96"},g).textContent=`Cementerio · ${S.cementerio.length}`;
  const alive=bots.filter(b=>b.vivo), dead=bots.filter(b=>!b.vivo);
  const order=[...alive,...dead].slice(0,5).map((b,i)=>[b,SPOTS[i]]).sort((a,b)=>(a[1][0]+a[1][1])-(b[1][0]+b[1][1]));
  const recent=S.ultima-2*HOUR;
  const labels=[];
  order.forEach(([b,[x,y]])=>{
    const v=value(b), rr=ret(b);
    const col=!b.vivo?"#6b7280": b.tipo==="ia"?"var(--amber)": rr>=0?"var(--lime)":"var(--red)";
    const dg=el("g",{class:"desk",tabindex:"0",role:"button","aria-label":`${b.nombre}, ${eur(v)}, ${pct(rr)}`},g);
    dg.addEventListener("click",()=>openDetail(b)); dg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetail(b)}});
    box(dg,x,y,1.3,0.55,26,"#f4f5ef","#9aa092","#b9beb0");                 // mesa
    const traded=b.trades.length && b.trades[b.trades.length-1].ts>=recent;
    const scr=el("g",{class:traded?"hot":""},dg);
    box(scr,x+0.35,y+0.08,0.6,0.08,58,"#1b2230","#0e131b","#141a24");     // monitor
    const m1=iso(x+0.4,y+0.16,52),m2=iso(x+0.9,y+0.16,52),m3=iso(x+0.9,y+0.16,32),m4=iso(x+0.4,y+0.16,32);
    scr.appendChild(poly([m1,m2,m3,m4],col));
    // persona
    const [px,py]=iso(x+0.65,y+0.95,0);
    el("ellipse",{cx:px,cy:py-2,rx:11,ry:5,fill:"#00000030"},dg);
    el("rect",{x:px-8,y:py-30,width:16,height:26,rx:6,fill:b.vivo?"#2c3444":"#555b66"},dg);
    el("circle",{cx:px,cy:py-37,r:8,fill:b.vivo?"#e8c6a0":"#8a8f99"},dg);
    if(!b.vivo) el("text",{x:px,y:py-33,"text-anchor":"middle","font-size":"11"},dg).textContent="✖";
    labels.push(()=>{
    const [lx,ly]=iso(x+0.65,y+0.27,84);
    const w=Math.max(118,b.nombre.length*7.2+20);
    el("rect",{x:lx-w/2,y:ly-30,width:w,height:40,rx:7,fill:"#161b24",stroke:col,"stroke-width":"1.5"},dg);
    el("text",{x:lx,y:ly-14,"text-anchor":"middle","font-family":"Inter Tight, system-ui, sans-serif","font-weight":"600","font-size":"12.5",fill:"#e9ecf2"},dg).textContent=b.nombre;
    const t=el("text",{x:lx,y:ly+2,"text-anchor":"middle","font-family":"Chakra Petch, Arial Narrow, sans-serif","font-size":"12.5",fill:col},dg);
    t.textContent=`${eur(v)} · ${pct(rr)}`;
    });
  });
  labels.forEach(f=>f());
  const w=document.querySelector(".floorwrap");
  if(w.scrollWidth>w.clientWidth && !w.dataset.s){ w.scrollLeft=(w.scrollWidth-w.clientWidth)/2; w.dataset.s="1" }
}

/* ---------- charla ---------- */
function say(b){
  const cur=holding(b), rr=ret(b);
  if(!b.vivo) return "Me he quedado por debajo del límite. Fuera de la liga.";
  if(b.tipo==="ia") return cur? `Llevo ${sym(cur)}. Espero órdenes de Albert para mover ficha.` : "En efectivo. Espero a que Albert me pida analizar el mercado.";
  if(!cur) return {momentum:"Todo cae. Espero a que algo tire.",contrarian:"Busco una caída fuerte para entrar.",disciplinado:"Fuera del mercado, respetando la espera.",breakout:"Vigilo máximos. Nada rompe todavía.",holder:"Preparado para comprar."}[b.tipo]||"Esperando señal.";
  const g=price(cur)/b.entry[cur]-1, p=b.params||{};
  const salida={
    holder:"No pienso vender.",
    momentum:`Sigo mientras sea el que más sube; lo reviso cada ${p.cada_h} h.`,
    contrarian:`Vendo a ${pct(p.tp)} o corto a ${pct(-p.sl)}.`,
    disciplinado:`Vendo la mitad a ${pct(p.tp)} y todo a ${pct(-p.sl)}.`,
    breakout:`Salgo si cae un ${Math.round(p.trailing*100)} % desde el pico.`
  }[b.tipo]||"";
  return `Aguanto ${sym(cur)}, ${pct(g)} desde mi entrada. ${salida}`;
}
function drawFeed(bots){
  const items=[];
  for(const b of bots) for(const t of b.trades) items.push({ts:t.ts,who:b.nombre,txt:`${t.accion==="COMPRA"?"Compro":"Vendo"} ${t.token} por ${eur(t.eur)}. ${t.nota}`});
  items.sort((a,b)=>b.ts-a.ts);
  const status=bots.map(b=>`<div class="msg"><span class="who">${esc(b.nombre)}</span><span class="when">ahora</span><p>${esc(say(b))}</p></div>`).join("");
  $("#feed").innerHTML = status + items.slice(0,40).map(i=>`<div class="msg"><span class="who">${esc(i.who)}</span><span class="when">${dt(i.ts)}</span><p>${esc(i.txt)}</p></div>`).join("");
}

/* ---------- pestañas ---------- */
function drawPane(bots){
  const P=$("#pane");
  if(tab==="ranking"){
    P.innerHTML=`<table><thead><tr><th>#</th><th>Bot</th><th>Estrategia</th><th class="num">Valor</th><th class="num">Rent.</th><th>Posición</th><th>Estado</th></tr></thead><tbody>${
      bots.map((b,i)=>{const cur=holding(b);return `<tr class="${b.vivo?"":"dead"}" data-id="${b.id}" tabindex="0" style="cursor:pointer"><td>${i+1}</td><td>${esc(b.nombre)}</td><td>${esc(b.tipo)}</td><td class="num">${eur(value(b))}</td><td class="num ${cls(ret(b))}">${pct(ret(b))}</td><td>${cur?sym(cur):"Efectivo"}</td><td>${b.vivo?"Vivo":"Muerto"}</td></tr>`}).join("")}</tbody></table>`;
    P.querySelectorAll("tr[data-id]").forEach(tr=>{const b=S.bots.find(x=>x.id==tr.dataset.id); tr.onclick=()=>openDetail(b); tr.onkeydown=e=>{if(e.key==="Enter")openDetail(b)}});
  }else if(tab==="ops"){
    const rows=[]; for(const b of bots) for(const t of b.trades) rows.push([t,b.nombre]);
    rows.sort((a,b)=>b[0].ts-a[0].ts);
    P.innerHTML=rows.length?`<table><thead><tr><th>Fecha</th><th>Bot</th><th>Acción</th><th>Token</th><th class="num">Importe</th><th>Motivo</th></tr></thead><tbody>${rows.slice(0,60).map(([t,n])=>`<tr><td>${dt(t.ts)}</td><td>${esc(n)}</td><td>${t.accion==="COMPRA"?"Compra":"Venta"}</td><td>${esc(t.token)}</td><td class="num">${eur(t.eur)}</td><td style="white-space:normal;min-width:320px">${esc(t.nota)}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Aún no hay operaciones. Los bots necesitan unas horas de historial de precios antes de su primera señal.</p>';
  }else if(tab==="mercado"){
    P.innerHTML=`<table><thead><tr><th>Token</th><th class="num">Precio</th><th class="num">24 h</th><th class="num">7 d</th></tr></thead><tbody>${
      Object.keys(CFG.tokens).filter(t=>price(t)!=null).map(t=>{const a=change(t,24),b=change(t,168);return `<tr><td>${sym(t)}</td><td class="num">${price(t).toPrecision(5)} €</td><td class="num ${a==null?"":cls(a)}">${a==null?"—":pct(a)}</td><td class="num ${b==null?"":cls(b)}">${b==null?"—":pct(b)}</td></tr>`}).join("")}</tbody></table>`;
  }else{
    P.innerHTML=S.rondas.length?`<table><thead><tr><th>Ronda</th><th>Ganador</th><th>Eliminados</th><th>Entran</th></tr></thead><tbody>${
      [...S.rondas].reverse().map(r=>`<tr><td>${r.ronda}</td><td>${esc(r.clasificacion[0]?.bot||"—")}</td><td>${esc(r.eliminados.map(e=>`${e.bot} (${e.motivo==="muerto"?"muerto":"último"})`).join(", ")||"—")}</td><td>${esc(r.entran.join(", ")||"—")}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">La primera ronda termina a los 14 días. Aquí verás quién gana, quién sale y quién entra.</p>';
  }
}
document.querySelectorAll(".tabs button").forEach(btn=>btn.addEventListener("click",()=>{
  tab=btn.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===btn)); S&&drawPane([...S.bots].sort((a,b)=>(a.vivo===b.vivo? ret(b)-ret(a) : a.vivo?-1:1)));
}));

/* ---------- ficha del bot ---------- */
function openDetail(b){
  const D=$("#detail"), c=b.curva||[];
  let spark="";
  if(c.length>1){
    const vs=c.map(x=>x[1]), mn=Math.min(...vs,CFG.capital_inicial_eur), mx=Math.max(...vs,CFG.capital_inicial_eur);
    const X=i=>i/(c.length-1)*280, Y=v=>60-(v-mn)/((mx-mn)||1)*56-2;
    const col=ret(b)>=0?"var(--lime)":"var(--red)";
    spark=`<svg viewBox="0 0 280 62" width="100%" aria-hidden="true"><line x1="0" x2="280" y1="${Y(CFG.capital_inicial_eur)}" y2="${Y(CFG.capital_inicial_eur)}" stroke="#394253" stroke-dasharray="3 4"/><polyline fill="none" stroke="${col}" stroke-width="2" points="${c.map((x,i)=>X(i)+","+Y(x[1])).join(" ")}"/></svg>`;
  }
  D.innerHTML=`<button class="close" aria-label="Cerrar">×</button><h3>${esc(b.nombre)}</h3>
    <div class="${cls(ret(b))}" style="font-family:var(--display);font-size:20px">${eur(value(b))} · ${pct(ret(b))}</div>
    <div style="color:var(--mute);font-size:13px">Estrategia: ${esc(b.tipo)}</div>
    ${spark}
    <h4>Mis reglas</h4><ol class="rules">${(b.reglas||[]).map(r=>`<li>${esc(r)}</li>`).join("")}</ol>
    <h4>Por qué he operado</h4>
    <ul>${[...b.trades].reverse().slice(0,12).map(t=>`<li><b>${dt(t.ts)} · ${t.accion==="COMPRA"?"Compra":"Venta"} ${esc(t.token)} ${eur(t.eur)}</b><br>${esc(t.nota)}</li>`).join("")||"<li>Sin operaciones todavía.</li>"}</ul>`;
  D.classList.add("open"); D.querySelector(".close").onclick=()=>D.classList.remove("open"); D.querySelector(".close").focus();
}

load(); setInterval(load,5*60*1000);
</script>
</body>
</html>
